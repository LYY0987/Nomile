[package]
name = "nomile"
version = "0.1.0"
description = "Nomile - batch file renamer"
authors = ["Nomile"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nomile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
unicode-normalization = "0.1"
kamadak-exif = "0.6.2"
lofty = "0.25.5"
tauri-plugin-window-state = "2.5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
pdf-extract = "0.7"
zip = { version = "=2.5.0", default-features = false, features = ["deflate"] }
calamine = "0.26"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
